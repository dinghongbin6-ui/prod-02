name: Test and deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EC2_HOST: 54.199.225.238
      EC2_USER: ec2-user
      EC2_DEPLOY_PATH: /home/ec2-user/prod-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Deploy over SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EC2_SSH_KEY" || { echo "Missing EC2_SSH_KEY secret"; exit 1; }
          test -n "$EC2_KNOWN_HOSTS" || { echo "Missing EC2_KNOWN_HOSTS secret"; exit 1; }

          key_file="$RUNNER_TEMP/ec2_deploy_key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh -i "$key_file" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$EC2_USER@$EC2_HOST" "bash -s -- '$EC2_DEPLOY_PATH'" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$1"
          cd "$DEPLOY_PATH"
          git pull --ff-only origin main
          npm ci
          npm run build
          pm2 restart prod-backend --update-env

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/health; then
              printf '\nBackend health check passed.\n'
              exit 0
            fi
            sleep 2
          done

          echo "Backend did not become healthy within 60 seconds. PM2 logs:"
          pm2 logs prod-backend --lines 80 --nostream || true
          exit 1
          REMOTE
